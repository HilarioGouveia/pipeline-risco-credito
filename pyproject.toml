[project]
name = "risco-credito"
version = "0.1.0"
description = "Pipeline preditivo de Risco de Crédito com Arquitetura Medallion, Scikit-Learn e Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.32.0",
    "pyarrow>=15.0.0",
    "joblib>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.uv]
package = false